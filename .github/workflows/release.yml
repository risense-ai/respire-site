name: Website artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Website git ref to build; the artifact records the resolved commit
        default: main
        type: string

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: homepage/package-lock.json
      - name: Build and check the website
        working-directory: homepage
        run: |
          npm ci
          npm test
          npm run build:preview
          npm run build
      - name: Package the exact website revision
        id: package
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          test -s site/dist/client/index.html
          test -s site/dist/client/zh/index.html
          mkdir artifact
          printf '%s\n' "$SHA" > artifact/site-sha.txt
          tar -czf "artifact/respire-site-${SHA}.tar.gz" -C site/dist/client .
          (cd artifact && sha256sum *.tar.gz site-sha.txt > SHA256SUMS)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ steps.package.outputs.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
